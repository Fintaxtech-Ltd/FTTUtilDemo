name: Publish to GitHub Packages

on:
  push:
    branches:
      - main  # Or publish only on tags

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump version
        id: bump_version
        run: |
          set -euo pipefail
          FILE="ftt-utils/build.gradle.kts"
          CURRENT=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' "$FILE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          PATCH=$((PATCH + 1))
          if [ "$PATCH" -ge 10 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          if [ "$MINOR" -ge 10 ]; then
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping version: $CURRENT -> $NEW_VERSION"

          sed -i "s/version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" "$FILE"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ftt-utils/build.gradle.kts
          git commit -m "chore: bump ftt-utils version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
          git push origin HEAD:main

      - name: Tag release
        run: |
          set -euo pipefail
          TAG="v${{ steps.bump_version.outputs.new_version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish with Gradle
        run: ./gradlew :ftt-utils:publishAllPublicationsToGitHubPackagesRepository
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
